plugins {
    id "java"
    id "io.canvasmc.weaver.userdev" version "${weaver_version}"
    id "xyz.jpenilla.run-paper" version "${run_paper_version}"
}

group = "com.unfamoussoul"
version = "1.0.0"

String canvasVersion = project.property('canvas_version')

int buildIndex = canvasVersion.indexOf('.build.')
if (buildIndex < 0) throw new GradleException("no '.build.' in canvas_version: $canvasVersion")

String canvasServerVersion = canvasVersion.substring(0, buildIndex)
String build_ver = canvasVersion.substring(buildIndex + '.build.'.length()).split('-')[0]

repositories {
    mavenCentral()
    maven { url = "https://maven.canvasmc.io/releases" }
    maven {
        url = "https://maven.canvasmc.io/snapshots"
        mavenContent { snapshotsOnly() }
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    paperweight.canvasDevBundle("${canvas_version}")
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    LinkedHashMap<String, String> props = [version: version]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("paper-plugin.yml") {
        expand props
    }
}

Provider<RegularFile> canvasServerJar = layout.buildDirectory.file("canvas/canvas-${canvasServerVersion}.jar")
TaskProvider<Task> downloadCanvas = tasks.register("downloadCanvas") {
    group = "run paper"
    description = "Download the Canvas ${canvasServerVersion} server jar."
    Provider<RegularFile> out = canvasServerJar
    outputs.file(out)
    onlyIf { !out.get().asFile.exists() }
    doLast {
        String url = "https://jenkins.canvasmc.io/job/Canvas/${build_ver}/artifact/canvas-server/build/libs/canvas-build.${build_ver}.jar"
        File target = out.get().asFile
        target.parentFile.mkdirs()
        new URI(url).toURL().withInputStream { input ->
            target.withOutputStream { it << input }
        }
    }
}

tasks.named("runServer") {
    dependsOn(downloadCanvas)
    minecraftVersion(canvasServerVersion)
    serverJar(canvasServerJar)
}
